<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>DevOps Portfolio — Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Kalam:wght@300;400;700&family=Architects+Daughter&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a1a;
    --ink-soft: #4a4a4a;
    --ink-faint: #9a9a9a;
    --paper: #fafaf7;
    --paper-2: #f3f2ec;
    --rule: #1a1a1a;
    --accent: #ff5b1f;     /* sketchy marker accent */
    --accent-soft: #ffd6c6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); }
  body {
    font-family: "Kalam", "Architects Daughter", sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
  }
  .hand { font-family: "Caveat", cursive; }
  .scribble { font-family: "Kalam", cursive; }
  .mono { font-family: "JetBrains Mono", monospace; }

  /* Page chrome */
  .topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding: 22px 48px;
    border-bottom: 1.5px solid var(--ink);
    background: var(--paper);
    position: sticky; top: 0; z-index: 5;
  }
  .topbar h1 {
    font-family: "Caveat"; font-weight: 700; font-size: 26px; margin: 0;
    letter-spacing: 0.5px;
  }
  .topbar .meta { font-family:"Kalam"; font-size: 14px; color: var(--ink-soft); }
  .switcher { display:flex; gap: 4px; padding: 4px; border: 1.5px solid var(--ink); border-radius: 999px; }
  .switcher button {
    font-family:"Kalam"; font-size: 13px; font-weight:700;
    background: transparent; border: 0; padding: 6px 14px; border-radius: 999px;
    cursor: pointer; color: var(--ink);
  }
  .switcher button.active { background: var(--ink); color: var(--paper); }

  /* Grid background for wireframe feel */
  .grid-bg {
    background-image:
      linear-gradient(to right, rgba(0,0,0,0.04) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0,0,0,0.04) 1px, transparent 1px);
    background-size: 24px 24px;
  }

  /* Frame */
  .frame {
    max-width: 1280px;
    margin: 0 auto;
    padding: 32px 48px 96px;
  }

  /* Sketchy block */
  .sk {
    border: 1.6px solid var(--ink);
    border-radius: 14px;
    background: var(--paper);
    position: relative;
    overflow: hidden;
  }
  .sk.dark { background: #111; color: #f3f2ec; border-color: #111; }
  .sk.soft { background: var(--paper-2); }
  .sk-pad { padding: 22px; }
  .sk-pad-lg { padding: 28px; }

  .label {
    font-family:"Kalam"; font-size: 12px; letter-spacing: 0.05em;
    color: var(--ink-soft); text-transform: uppercase;
  }
  .h-xl { font-family:"Caveat"; font-weight: 700; font-size: 56px; line-height: 1.02; letter-spacing: 0.5px; }
  .h-lg { font-family:"Caveat"; font-weight: 700; font-size: 38px; line-height: 1.05; }
  .h-md { font-family:"Caveat"; font-weight: 700; font-size: 28px; line-height: 1.1; }
  .h-sm { font-family:"Kalam"; font-weight: 700; font-size: 18px; }
  .body { font-family:"Kalam"; font-size: 15px; line-height: 1.55; color: var(--ink-soft); }
  .tiny { font-family:"Kalam"; font-size: 12px; color: var(--ink-faint); }

  /* Placeholder lines (text blocks) */
  .lines { display:flex; flex-direction:column; gap: 8px; }
  .lines i {
    display:block; height: 8px; border-radius: 4px;
    background: repeating-linear-gradient(45deg, #d6d4cc, #d6d4cc 4px, #e8e6df 4px, #e8e6df 8px);
  }
  .lines.dark i { background: repeating-linear-gradient(45deg, #2a2a2a, #2a2a2a 4px, #1d1d1d 4px, #1d1d1d 8px); }
  .lines i.w80 { width: 80%; } .lines i.w60 { width: 60%; } .lines i.w90 { width: 90%; } .lines i.w40 { width: 40%; } .lines i.w70 { width: 70%; }

  /* Image placeholder */
  .ph {
    background:
      repeating-linear-gradient(135deg, #e8e6df 0 10px, #f3f2ec 10px 20px);
    border: 1.4px dashed var(--ink-faint);
    border-radius: 10px;
    display:flex; align-items:center; justify-content:center;
    color: var(--ink-soft);
    font-family:"JetBrains Mono"; font-size: 11px; letter-spacing: 0.05em;
    text-transform: uppercase;
    min-height: 80px;
  }
  .ph.dark {
    background: repeating-linear-gradient(135deg, #1a1a1a 0 10px, #232323 10px 20px);
    color: #888; border-color: #555;
  }
  .ph.tall { min-height: 220px; }
  .ph.xtall { min-height: 320px; }

  /* Sketchy button */
  .btn {
    display:inline-flex; align-items:center; gap: 8px;
    padding: 10px 18px; border: 1.6px solid var(--ink); border-radius: 999px;
    background: var(--paper); color: var(--ink);
    font-family:"Kalam"; font-weight: 700; font-size: 14px; cursor: pointer;
    text-decoration: none;
  }
  .btn.dark { background: var(--ink); color: var(--paper); }
  .btn .arr { display:inline-block; transform: translateY(-1px); }
  .pill {
    display:inline-flex; align-items:center;
    padding: 4px 10px; border: 1.4px solid var(--ink); border-radius: 999px;
    font-family:"Kalam"; font-size: 12px; color: var(--ink);
    background: var(--paper);
  }

  /* Annotation arrows / notes */
  .note {
    position: absolute;
    font-family:"Caveat"; color: var(--accent);
    font-size: 18px; font-weight: 600;
    pointer-events: none;
  }
  .note svg { display:block; }

  /* Layout helpers */
  .row { display: flex; gap: 16px; }
  .col { display: flex; flex-direction: column; gap: 16px; }
  .grid { display: grid; gap: 16px; }
  .gap-sm { gap: 10px; }

  /* Stats */
  .stat { display:flex; flex-direction:column; gap: 4px; }
  .stat .n { font-family:"Caveat"; font-weight:700; font-size: 32px; line-height:1; }
  .stat .l { font-family:"Kalam"; font-size: 12px; color: var(--ink-soft); }

  /* Avatar circle */
  .avatar {
    width: 56px; height: 56px; border-radius: 50%;
    border: 1.6px solid var(--ink);
    background: repeating-linear-gradient(135deg, #e8e6df 0 6px, #f3f2ec 6px 12px);
  }

  /* Approach badge */
  .approach-badge {
    display:inline-flex; align-items:center; gap: 8px;
    padding: 6px 12px; border-radius: 999px;
    background: var(--accent-soft); color: var(--ink);
    font-family:"Kalam"; font-weight:700; font-size: 13px;
  }
  .approach-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

  .description {
    max-width: 720px; margin: 18px 0 28px;
    font-family:"Kalam"; font-size: 15px; color: var(--ink-soft); line-height: 1.6;
  }

  /* Underline scribble */
  .uline { position: relative; display:inline-block; }
  .uline::after {
    content:""; position:absolute; left:-2px; right:-2px; bottom: -6px; height: 6px;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 6' preserveAspectRatio='none'><path d='M0 4 Q 25 0 50 3 T 100 2' stroke='%23ff5b1f' stroke-width='2' fill='none'/></svg>") center/100% 100% no-repeat;
  }

  /* Tags */
  .tags { display:flex; flex-wrap: wrap; gap: 6px; }

  /* Annotation flag */
  .flag {
    display:inline-flex; align-items:center; gap:6px;
    padding: 2px 8px; background: #fff3a8; color: var(--ink);
    font-family:"Caveat"; font-size: 15px; font-weight:700;
    border: 1.2px solid var(--ink); border-radius: 6px;
    transform: rotate(-1.2deg);
  }

  /* hide tweaks if not loaded */
  #tweaks-root:empty { display:none; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <h1>DevOps Portfolio — v1 mid-fi</h1>
    <div class="meta">polished · real icons · animated cursor</div>
    <div id="nav-switcher"></div>
  </header>

  <main id="app"></main>

  <div id="tweaks-root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="src/tweaks-panel.jsx"></script>
  <script type="text/babel" src="src/parts.jsx"></script>
  <script type="text/babel" src="src/approach-a.jsx"></script>
  <script type="text/babel" src="src/approach-b.jsx"></script>
  <script type="text/babel" src="src/approach-c.jsx"></script>
  <script type="text/babel" src="src/approach-a-variations.jsx"></script>
  <script type="text/babel" src="src/approach-a5-mix-variations.jsx"></script>
  <script type="text/babel" src="src/refined-v1.jsx"></script>
  <script type="text/babel" src="src/midfi-v1.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
